name: SDI Minggu 9

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        working-directory: assignment/task-03/sdi-minggu9
        run: python -m compileall -q app.py test_unit.py test_integration.py package.py verify.py

      - name: Unit tests
        working-directory: assignment/task-03/sdi-minggu9
        run: python -m unittest -v test_unit

      - name: Integration tests
        working-directory: assignment/task-03/sdi-minggu9
        run: python -m unittest -v test_integration

      - name: Package candidate
        working-directory: assignment/task-03/sdi-minggu9
        run: python package.py

      - name: Store candidate
        uses: actions/upload-artifact@v4
        with:
          name: sdi-m9-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: assignment/task-03/sdi-minggu9/dist/*
          if-no-files-found: error
          retention-days: 7